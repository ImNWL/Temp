<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>策略对比</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- macOS Sequoia Vibrancy Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-brand">
          <span class="sidebar-brand-title">对比配置</span>
          <span class="group-count" id="selected-count-badge">0</span>
        </div>

        <!-- Group 1: Basket -->
        <section class="sidebar-section">
          <div class="section-heading">对比篮子</div>

          <form class="add-ticker-form" id="add-ticker-form" autocomplete="off">
            <label class="field-label" for="new-ticker-input">添加新标的</label>
            <div class="add-input-row">
              <input
                type="text"
                id="new-ticker-input"
                class="apple-input"
                spellcheck="false"
              />
              <button type="submit" class="apple-btn apple-btn-primary" id="add-ticker-btn">
                加入
              </button>
            </div>
          </form>

          <div class="field-block">
            <span class="field-label">已选股票 / 策略</span>
            <div class="inset-group asset-list" id="asset-list" role="listbox" aria-multiselectable="true"></div>
          </div>

          <div class="refresh-block" id="refresh-block">
            <div class="inset-group settings-rows">
              <div class="setting-row">
                <label class="setting-label" for="full-update-toggle">全量拉取（2015年起）</label>
                <label class="ios-switch">
                  <input type="checkbox" id="full-update-toggle" />
                  <span class="ios-switch-slider"></span>
                </label>
              </div>
            </div>
            <button type="button" class="apple-btn apple-btn-secondary full-width" id="refresh-market-btn">
              更新已选行情
            </button>
          </div>
        </section>

        <div class="sidebar-divider"></div>

        <!-- Group 2: Synthetic Leverage -->
        <section class="sidebar-section">
          <div class="section-heading">合成杠杆（如 xQQQ）</div>

          <div class="inset-group settings-rows">
            <div class="setting-row">
              <label class="setting-label" for="enable-synth-toggle">叠加合成杠杆曲线</label>
              <label class="ios-switch">
                <input type="checkbox" id="enable-synth-toggle" checked />
                <span class="ios-switch-slider"></span>
              </label>
            </div>

            <div class="synth-controls" id="synth-controls">
              <div class="setting-row">
                <label class="setting-label" for="synth-base-select">基准标的</label>
                <div class="select-wrap inline-select">
                  <select id="synth-base-select" class="apple-select borderless"></select>
                </div>
              </div>

              <div class="setting-row">
                <label class="setting-label" for="leverage-input">杠杆倍数 x</label>
                <div class="stepper-control compact">
                  <button type="button" class="stepper-btn" id="lev-dec-btn" aria-label="减小杠杆">−</button>
                  <input
                    type="number"
                    id="leverage-input"
                    class="stepper-input"
                    min="-5"
                    max="10"
                    step="0.1"
                    value="1.5"
                  />
                  <button type="button" class="stepper-btn" id="lev-inc-btn" aria-label="增加杠杆">+</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="parse-warning hidden" id="parse-warning"></div>
      </div>
    </aside>

    <!-- Main Stage -->
    <main class="workspace">
      <!-- Clean Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="icon-btn"
            id="sidebar-toggle-btn"
            title="收起/展开侧边栏"
            aria-label="收起或展开侧边栏"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <rect x="2" y="3" width="14" height="12" rx="2.5" stroke="currentColor" stroke-width="1.4"/>
              <line x1="6.5" y1="3.5" x2="6.5" y2="14.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
          <h1 class="page-title">策略对比</h1>
        </div>
        <div class="topbar-right">
          <div class="status-pill" id="status-pill">
            <span class="status-dot"></span>
            <span id="status-text">加载数据中...</span>
          </div>
        </div>
      </header>

      <!-- Apple Stocks Studio Card -->
      <section class="studio-card">
        <!-- Unified Sleek Control Bar -->
        <div class="studio-control-bar">
          <div class="control-cluster">
            <div class="segmented-control" id="preset-bar" role="tablist" aria-label="快捷周期">
              <button type="button" class="seg-btn" data-preset="YTD">YTD</button>
              <button type="button" class="seg-btn" data-preset="近1年">近1年</button>
              <button type="button" class="seg-btn" data-preset="近3年">近3年</button>
              <button type="button" class="seg-btn" data-preset="近5年">近5年</button>
              <button type="button" class="seg-btn active" data-preset="近10年">近10年</button>
              <button type="button" class="seg-btn" data-preset="全部">全部</button>
            </div>

            <div class="date-range-capsule">
              <label class="iso-date-field" title="点击选择开始日期">
                <span class="iso-date-text" id="start-date-display">—</span>
                <input type="date" id="start-date-input" class="sr-date-input" aria-label="开始日期" />
              </label>
              <span class="date-sep">—</span>
              <label class="iso-date-field" title="点击选择结束日期">
                <span class="iso-date-text" id="end-date-display">—</span>
                <input type="date" id="end-date-input" class="sr-date-input" aria-label="结束日期" />
              </label>
            </div>
          </div>

          <div class="control-cluster">
            <div class="segmented-control" id="scale-bar" role="tablist" aria-label="坐标轴模式">
              <button type="button" class="seg-btn active" data-scale="linear">线性</button>
              <button type="button" class="seg-btn" data-scale="log">对数</button>
            </div>
          </div>
        </div>

        <!-- Editorial Apple Stocks Ticker Readout Strip -->
        <div class="editorial-legend" id="curve-legend-bar"></div>

        <!-- Contextual Notices -->
        <div class="chart-notices" id="chart-notices"></div>

        <!-- High-DPI Retina Chart Canvas -->
        <div class="chart-stage" id="chart-stage">
          <canvas id="main-chart-canvas"></canvas>
          <div class="floating-hud hidden" id="floating-hud"></div>
          <div class="floating-hud floating-hud-dd hidden" id="drawdown-floating-hud"></div>
        </div>

        <!-- TradingView-Style Illuminated Timeline Navigator Ruler -->
        <div class="navigator-section">
          <div class="navigator-header">
            <span class="navigator-title">时间轴标尺</span>
            <span class="navigator-hint" id="navigator-span-info">拖动左右手柄裁切时段 · 按住选区滑动 · 主图滚轮缩放</span>
          </div>
          <div class="navigator-stage" id="navigator-stage">
            <canvas id="navigator-canvas"></canvas>
          </div>
        </div>
      </section>

      <!-- Clean Apple Summary Table Card -->
      <section class="summary-card">
        <div class="summary-header">
          <h3 class="summary-title">区间表现汇总</h3>
          <span class="summary-window-label" id="summary-window-label"></span>
        </div>
        <div class="table-scroll">
          <table class="apple-table" id="summary-table">
            <thead>
              <tr>
                <th data-sort="name">标的</th>
                <th data-sort="kindLabel">类型</th>
                <th data-sort="rangeText">有效区间</th>
                <th data-sort="finalMult" class="num">最终倍数</th>
                <th data-sort="totalRet" class="num">累计收益</th>
                <th data-sort="cagr" class="num">年化收益</th>
                <th data-sort="annVol" class="num">年化波动率</th>
                <th data-sort="maxDd" class="num">最大回撤</th>
              </tr>
            </thead>
            <tbody id="summary-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
  <script src="/static/app.js"></script>
</body>
</html>
